  <!-- Estilos para el iframe -->
  <style>
    /* Eliminar scroll de la página principal */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* Elimina el scroll de la página */
    }

    .container {
      margin: 0 auto;
    }

    .iframe-container {
      position: fixed;
      top: 70px; /* Altura del navbar en escritorio */
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      overflow: hidden; /* Elimina scroll del iframe */
    }

    /* Media query para móviles */
    @media (max-width: 768px) {
      .iframe-container {
        top: 58px; /* Altura del navbar en móvil */
      }
    }

    /* Estilos adicionales para mejorar el manejo táctil en móvil */
    @media (max-width: 768px) {
      iframe {
        -webkit-overflow-scrolling: touch; /* Mejora el scroll táctil en iOS */
        touch-action: manipulation; /* Optimiza el manejo táctil */
      }
    }
  </style>
</head>

  <div class="iframe-container">
    <iframe id="ticketsIframe" src="about:blank"></iframe>
  </div>

<!-- Scripts -->
<script src="../script.js"></script>

<script>
  function loadIframe() {
    const baseUrl = "https://libretickets.com";
    const companyTag = "sunset_drive_cba";
    const companyName = "Sunset Drive"; // Nombre legible de la empresa

    if (!baseUrl || !companyTag) {
      alert("Por favor completa todos los campos");
      return;
    }

    const parentUrl = encodeURIComponent(window.location.href);
    const encodedCompanyName = encodeURIComponent(companyName);
    const url = `${baseUrl}/${companyTag}?iframe=true&parentUrl=${parentUrl}&companyName=${encodedCompanyName}`;
    const iframe = document.getElementById("ticketsIframe");

    iframe.src = url;
    console.log("Cargando iframe con URL:", url);
  }

  // Cargar automáticamente al iniciar
  window.onload = function () {
    loadIframe();
  };
</script>
