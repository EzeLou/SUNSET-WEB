    <!-- Estilos para el iframe -->
    <style>
      /* Eliminar scroll de la página principal */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* Elimina el scroll de la página */
        background-color: #212121;
        /* Fondo oscuro consistente con theme.palette.grey[900] */
      }

      .container {
        margin: 0 auto;
      }

      .iframe-container {
        position: fixed;
        top: 70px;
        /* Altura del navbar en escritorio */
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        overflow: hidden;
        /* Elimina scroll del iframe */
      }

      /* Media query para móviles */
      @media (max-width: 768px) {
        .iframe-container {
          top: 58px;
          /* Altura del navbar en móvil */
        }
      }

      /* Estilos adicionales para mejorar el manejo táctil en móvil */
      @media (max-width: 768px) {
        iframe {
          -webkit-overflow-scrolling: touch;
          /* Mejora el scroll táctil en iOS */
          touch-action: manipulation;
          /* Optimiza el manejo táctil */
        }
      }

      /* Loading inicial */
      .initial-loading {
        position: fixed;
        top: 70px;
        /* Altura del navbar en desktop */
        left: 0;
        right: 0;
        bottom: 0;
        background: #212121;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        transition: opacity 0.3s ease-out;
        gap: 24px;
      }

      /* Ajuste para móvil */
      @media (max-width: 768px) {
        .initial-loading {
          top: 58px;
          /* Altura del navbar en móvil */
        }
      }

      .initial-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Barra de progreso */
      .loading-progress {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(1, 234, 237, 0.1);
        overflow: hidden;
      }

      .loading-progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #01eaed, #01e696);
        animation: loading-progress 2s infinite;
      }

      @keyframes loading-progress {
        0% {
          left: -100%;
        }

        100% {
          left: 100%;
        }
      }

      /* Spinner */
      .loading-spinner {
        width: 35px;
        height: 35px;
        border: 3px solid rgba(1, 234, 237, 0.2);
        border-top: 3px solid #01eaed;
        border-radius: 50%;
        animation: loading-spin 1s linear infinite;
      }

      .loading-text {
        font-size: 16px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin-top: 8px;
      }

      @keyframes loading-spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

    <!-- Scripts -->

    <script>
      function hideInitialLoading() {
        const initialLoading = document.getElementById("initialLoading");
        if (initialLoading) {
          initialLoading.classList.add("hidden");
          // Remover el elemento después de la transición
          setTimeout(() => {
            if (initialLoading.parentNode) {
              initialLoading.parentNode.removeChild(initialLoading);
            }
          }, 300);
        }
      }

      function loadIframe() {
        const baseUrl = "https://libretickets.com";
        const companyTag = "sunset_drive_cba";
        const companyName = "Sunset Drive"; // Nombre legible de la empresa
        const companyLogoUrl =
          "https://firebasestorage.googleapis.com/v0/b/ventapp-ed173.appspot.com/o/ventaap%2Fposts%2Fimg%2Fd61f8388-5e54-4830-a629-7cb1bc006c68?alt=media&token=7c945dc1-1bae-4624-889b-3afa9febfc90"; // URL del logo de la empresa
        if (!baseUrl || !companyTag) {
          alert("Por favor completa todos los campos");
          hideInitialLoading();
          return;
        }

        const parentUrl = encodeURIComponent(window.location.href);
        const encodedCompanyName = encodeURIComponent(companyName);
        const encodedCompanyLogoUrl = encodeURIComponent(companyLogoUrl);
        const url = `${baseUrl}/${companyTag}?iframe=true&parentUrl=${parentUrl}&companyName=${encodedCompanyName}&companyLogoUrl=${encodedCompanyLogoUrl}`;
        const iframe = document.getElementById("ticketsIframe");

        // Ocultar el loading cuando el iframe cargue
        iframe.onload = function () {
          setTimeout(() => {
            hideInitialLoading();
          }, 500); // Pequeño delay para una transición más suave
        };

        // También ocultar el loading si hay un error
        iframe.onerror = function () {
          hideInitialLoading();
        };

        iframe.src = url;
        console.log("Cargando iframe con URL:", url);
      }

      // Cargar automáticamente al iniciar
      window.onload = function () {
        loadIframe();
      };
    </script>
